# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "hironaka: Hironaka's resolution of singularities in characteristic zero, in Lean 4"
  description: >
    A Lean 4 formalization, over Mathlib, of resolution of singularities in characteristic zero:
    Hironaka's Main Theorems I (with its weak form), II and II(N) and his Corollaries 1 and 3 to
    Main Theorem II for algebraic schemes over a field of characteristic zero, Kollár's strong
    resolution of a variety and his functorial principalization and resolution (his Theorems 27,
    35 and 36), Włodarczyk's embedded desingularization with smooth centres, Hironaka's
    real-analytic principalization (Main Theorem II″(N)), the Bierstone–Milman principalization
    with the Jacobian clause, Włodarczyk's functorial locally finite principalization and his
    embedded desingularization of analytic subspaces of analytic manifolds, all four in
    Włodarczyk's compatible-family form, and the resolution of reduced real- and complex-analytic
    spaces (Kollár's Theorem 45, with its surjective form over ℂ); and two classical consequences
    stated with Mathlib imports only, Hironaka's Main Theorem I as the resolution of a variety by a
    single blow-up (with two definitions Mathlib lacks, effective Cartier ideal sheaves and the
    blow-up as a universal property) and the local monomialization of a real-analytic function
    (Atiyah's Resolution Theorem) with the Jacobian clause of Bierstone–Milman. The proofs follow the
    order-reduction method of Włodarczyk and Kollár on schemes and re-run it on real- and
    complex-analytic manifolds.
  authors:
    - "Claude agents (Anthropic Claude Code sessions operated by Resolution)"
    - "Chris Elliott (Resolution; direction and audit of the formalization campaign)"
    - "Billy Snikkers (Resolution; refactoring and release preparation after the campaign)"
    - "Adam Newgas (Resolution; refactoring and release preparation after the campaign)"
  responsible_maintainers:
    - "Resolution Alignment"
  license: "Apache-2.0 (LICENSE, Copyright (c) 2026 Resolution)"

sources:
  - title: >-
      Resolution of singularities of an algebraic variety over a field of characteristic zero. I, II
    authors: ["Heisuke Hironaka"]
    id: >-
      doi:10.2307/1970486 and doi:10.2307/1970547 (Annals of Mathematics (2) 79 (1964), 109–203 and
      205–326)
    type: "article"
    location: >
      Main Theorem I, also in Mathlib's terms, and the weak form stated in the paragraph after it
      (p. 132); Main Theorem II (pp. 142–143) with Corollary 1 (pp. 143–144) and Corollary 3
      (p. 146); Main Theorem II(N) (p. 176); Main Theorem II″(N) (pp. 158–159), whose conclusion is
      that of Main Theorem II′(N) (p. 156).
    relationship: "formalizes"
    note: >
      The theorems are formalized over a field of characteristic zero, as Main Theorems I and II and
      Corollaries 1 and 3 are printed. Hironaka's more general base, a local ring of his class ℬ (p.
      151; defined p. 161), over which Main Theorem II(N) is stated (p. 162), is not formalized.
    author_endorsement: "not-contacted"
  - title: "Lectures on Resolution of Singularities"
    authors: ["János Kollár"]
    id: >-
      Annals of Mathematics Studies 166, Princeton University Press, 2007 (isbn:9780691129235);
      Chapter 3 circulated as "Resolution of singularities – Seattle lecture", arXiv:math/0508332v3
    type: "book"
    location: >
      Theorem 27 (strong resolution of a quasi-projective variety), Theorem 35 (functorial
      principalization), Theorem 36 (functorial resolution), Theorem 45 (resolution of analytic
      spaces; over ℂ, its clauses (1)–(4) in a surjective form); the proofs follow Theorems 68 and
      69 (order reduction), item 72, Proposition 37 and Lemma 39; on analytic manifolds the
      commutation with closed embeddings (34.3, Theorem 35 (5)) follows Claim 71.2 from Theorem
      107 (3) at the mark 1 and Theorem 103 (3), along flags (item 108).
    relationship: "formalizes"
    note: >
      The text consulted is the arXiv version, and item numbers follow it; the book's "3.N"
      numbering was not checked, and its Chapters 1–2 were not consulted.
    author_endorsement: "not-contacted"
  - title: "Simple Hironaka resolution in characteristic zero"
    authors: ["Jarosław Włodarczyk"]
    id: >-
      doi:10.1090/S0894-0347-05-00493-5 (Journal of the American Mathematical Society 18 (2005),
      779–822); arXiv:math/0401401
    type: "article"
    location: "Theorem 1.0.2 (embedded desingularization with smooth centres); §4.6–4.7"
    relationship: "formalizes"
    note: >
      Also the source of the method: the homogenization (tuning) of ideals that makes the
      order-reduction induction run, followed through Kollár's presentation.
    author_endorsement: "not-contacted"
  - title: "Resolution of singularities of analytic spaces"
    authors: ["Jarosław Włodarczyk"]
    id: >-
      Proceedings of the 15th Gökova Geometry–Topology Conference (2008), International Press,
      2009, 31–63; https://gokovagt.org/proceedings/2008/ggt08-wlodarczyk.pdf
    type: "article"
    location: >
      Theorem 2.0.1 (resolution), Theorem 2.0.2 (locally finite embedded desingularization),
      Theorem 2.0.3 (locally finite principalization) with the extensions of Definition 3.2.6, its
      commutation with local analytic isomorphisms in the form of Theorem 3.5.1 (2) (with
      Proposition 3.4.1 and Definition 3.4.2) and its commutation with embeddings of ambient
      varieties in the form of Kollár's commutation with closed embeddings (Kollár 2007, 34.3 and
      Theorem 35 (5)); Lemma 4.0.3 (the principalization is an isomorphism off the cosupport); §4
      (gluing over relatively compact opens)
    relationship: "formalizes"
    note: >
      Also the source of the compatible-family form in which the analytic main theorems are stated.
    author_endorsement: "not-contacted"
  - title: >-
      Canonical desingularization in characteristic zero by blowing up the maximum strata of a
      local invariant
    authors: ["Edward Bierstone", "Pierre D. Milman"]
    id: >-
      doi:10.1007/s002220050141 (Inventiones Mathematicae 128 (1997), 207–302); Chapter I as
      arXiv:alg-geom/9508005
    type: "article"
    location: "Theorem 1.10 and the sentence following it; the category of spaces of §3"
    relationship: "formalizes"
    note: >
      Only Chapter I (the arXiv text) was consulted.
    author_endorsement: "not-contacted"
  - title: "Resolution of singularities and division of distributions"
    authors: ["Michael F. Atiyah"]
    id: >-
      doi:10.1002/cpa.3160230202 (Communications on Pure and Applied Mathematics 23 (1970),
      145–150)
    type: "article"
    location: "Resolution Theorem, p. 147"
    relationship: "formalizes"
    note: >
      The source of the local monomialization of a real-analytic function, stated with Mathlib's
      definitions.
    author_endorsement: "not-contacted"
  - title: "Meromorphic property of the functions P^λ"
    authors: ["I. N. Bernshtein", "S. I. Gel'fand"]
    id: >-
      doi:10.1007/BF01078276 (Functional Analysis and Its Applications 3 (1969), 68–69)
    type: "article"
    relationship: "background"
    note: >-
      Lemma 1, the monomialization of a regular function on a real algebraic manifold, found
      independently of Atiyah.
  - title: "Blowups and resolution"
    authors: ["Herwig Hauser"]
    id: >-
      in: The Resolution of Singular Algebraic Varieties, Clay Mathematics Proceedings 20, American
      Mathematical Society, 2014, 1–80; arXiv:1404.1041
    type: "article"
    relationship: "background"
    note: >-
      The elementary theory of blow-ups and the worked examples of HironakaExamples.
  - title: "The Stacks Project"
    authors: ["The Stacks Project Authors"]
    id: "https://stacks.math.columbia.edu"
    type: "web post"
    relationship: "background"
    note: "Cited by tag for the scheme-theoretic facts the proofs use."
  - title: "Semianalytic and subanalytic sets"
    authors: ["Edward Bierstone", "Pierre D. Milman"]
    id: "doi:10.1007/BF02699126 (Publications Mathématiques de l'IHÉS 67 (1988), 5–42)"
    type: "article"
    location: >
      Definition 4.1 (blowing up), p. 23 and Definition 4.6 (germs and their order), the proof of
      Theorem 4.4
    relationship: "background"
    note: >
      The blowing-up of an analytic manifold along a closed submanifold, in the charts of
      Definition 4.1, which the manifold blow-ups of the library follow, and the local algebra of
      analytic germs (Weierstrass preparation in a distinguished last coordinate) in the form the
      proof of Theorem 4.4 uses.

classification:
  arxiv: ["math.AG", "math.CV"]
  msc2020: ["14E15", "32S45", "32C05", "14B05"]

status:
  scope: >
    The main theorems are the theorems of comparator.json. Each is stated at the end of the module
    of `Hironaka` that proves it, with the same statement and docstring as its copy in the Challenge
    files (Challenge.lean and the modules under Challenge/), which import only the definition
    modules, and leanprover/comparator checks that the library proves them. All are proved. Not
    proved: Hironaka's Main Theorem I in the strong form, Main Theorem I* and the inductive Main
    Theorem I(n) (normal flatness along the centres, which the order-reduction route does not
    produce); Main Theorem I for a reduced X that is not irreducible, as his Introduction (p. 112)
    describes it; the real-analytic Main Theorem I″(n); the complex-analytic Main Theorems I′(n) and
    II′(N), stated for complex spaces admitting a projective morphism to a complex Stein space (pp.
    155, 156), and the local Main Theorems I′ and II′ (pp. 151–152), out of scope; Corollary 2 and
    the three consequences of Corollary 1 (pp. 144–145). Neither library contains a `sorry`; the
    only `sorry`s in the repository are the deliberate bodies of the Challenge modules. Every
    constant of both libraries depends on no axiom beyond propext, Classical.choice and Quot.sound.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
