      lean: "AnalyticManifold.exists_extensionCompatibleFamily_isNormalCrossingsDivisor_jacobianIdeal_mul_pullback"
      module: "Hironaka/Resolution/Analytic/BM97/JacobianAssembly.lean"
      status: "proved"
      note: |-
        - Translation. `I.pullback F.map F.map.contMDiff` is Bierstone–Milman's
          $\sigma^{-1}(I) = \sigma^*(I) \cdot \mathcal{O}_{M_k}$, and
          `F.map.jacobianIdeal * I.pullback F.map F.map.contMDiff` their
          $\mathcal{J} \cdot \sigma^{-1}(I)$, $\mathcal{J}$ the ideal generated by the Jacobian
          determinant of $\sigma$;
          `(F.seq K).weakTransformSeq (I.restrict (F.nhd K)) (Fin.last _) = ⊤` is their
          $I_k = \mathcal{O}_{M_k}$; `(F.seq K).HasSncBoundaries ⊤` is the clause on the exceptional
          divisors $E_j$, `⊤` being the empty boundary; and `F.map.IsIsoOver I.supportᶜ` says that
          $\sigma$ is an isomorphism over the complement of the support of $I$.
        - Correction. The hypothesis that `I` has nonzero stalks (`hI`) is tacit in the source:
          without it $\sigma^*(I)$ could not be a divisor. Kollár's principalization states it
          explicitly, for an ideal sheaf "not zero on any irreducible component" [Kol07, Theorem
          35].
        - Interpretation. Bierstone–Milman's "smooth $\mathrm{inv}_I$-admissible centres" are read
          as smooth centres having simple normal crossings with the exceptional divisor accumulated
          so far; the invariant $\mathrm{inv}_I$ does not appear in the statement.
        - Strengthening. Bierstone–Milman's finite sequence of blow-ups, for a quasi-compact $|M|$,
          is here a finite succession over a neighbourhood of every compact, compatible across
          compacts: for a manifold that is not quasi-compact the finite sequence is replaced by a
          locally finite one, by analogy with the remark after [BM97, Theorem 1.6], which is made
          for Theorem 1.6 only. For a compact `M` the family contains one finite succession over
          `M`.
        - Strengthening. That the last exceptional divisor $E_r$ has simple normal crossings (in
          `HasSncBoundaries`) is not a clause of [BM97, Theorem 1.10]: it is their remark that
          admissibility "guarantees that $E_{i+1}$ is a collection of smooth hypersurfaces having
          only normal crossings" [BM97, after (1.2)], and [Wlo09, Theorem 2.0.3 (2)] at $i = r$.
        - Strengthening. The clause that $\sigma$ is an isomorphism over the complement of the
          support of $I$ (`F.map.IsIsoOver I.supportᶜ`) is not in [BM97, Theorem 1.10] or [Wlo09,
          Theorem 2.0.3]; it is [Wlo09, Lemma 4.0.3], cf. [Kol07, Theorem 35 (3)].
    - source: "Włodarczyk 2009, Theorem 2.0.3, p. 35; Kollár 2007, Theorem 35"
      lean: "AnalyticManifold.exists_functorial_principalization"
      module: "Hironaka/Resolution/Analytic/Wlo09/FunctorialPrincipalization.lean"
      status: "proved"
      note: |-
        - Translation. `P` is Włodarczyk's principalization as a rule on all pairs $(M, I)$, the
          morphism $\mathrm{prin}$ of his last sentence: for the pair `T = (M, I)`, `P T` is the
          compatible family of $\mathrm{prin}_I \colon \tilde M \to M$, and
          `T.I.IsLocallyFinitelyPrincipalizedBy (P T)` is his "there exists a locally finite
          principalization of $I$", with clauses (1)–(3).
        - Translation. "Embeddings of ambient varieties" in the last sentence is read as Kollár's
          commutation with closed embeddings [Kol07, Theorem 35 (5)], in the form of [Kol07, 34.3]
          for an empty boundary: $B(X, I_X) = j_* B(Y, I_Y)$ for a closed embedding $j$ of smooth
          varieties with $\mathcal{O}_X / I_X = j_*(\mathcal{O}_Y / I_Y)$, here
          `I.IsPushforwardAlong J τ` with the closed embedding `τ` (an analytic embedding with
          closed image), whose image is a closed submanifold: the ideal of the image
          (`vanishingStalk`) lies in `I`, and `J = τ^*I`. This is Włodarczyk's
          $I = \tau_*(J) \cdot \mathcal{O}_M$ [Wlo09, Remark (3) after Theorem 2.0.3], whose
          canonical resolution has the centres $\tau(C_i)$ of that of $J$ [Wlo09, Theorem 3.5.1
          (3)]. The proof follows Kollár's derivation from his Claim 71.2 [Kol07, 72], the
          commutation of the marked order reduction with closed embeddings, through [Kol07, Theorem
          107 (3)] and [Kol07, Theorem 103 (3)] at the mark `1`, the value of `P`.
        - Correction. The hypothesis that $I$ has nonzero stalks (the field `isNonzeroEverywhere` of
          the pair) is tacit in the source: otherwise the total transform $\sigma^{r*}(I)$ could not
          be the ideal of a divisor. Kollár states it explicitly, for an ideal sheaf "not zero on
          any irreducible component" [Kol07, Theorem 35]. The ideal sheaves with a zero stalk are
          not inputs, so nothing is asserted of them.
        - Interpretation. In Włodarczyk's clause (3), the total transform $\sigma^{r*}(I)$ "is the
          ideal of a simple normal crossing divisor $\tilde E_U$ which is a locally finite
          combination of the irreducible components of the divisor $E_{U_r}$": the exponents of
          $\tilde E_U$ are read at each point, $\tilde E_U$ near a point being a combination of the
          components of $E_{U_r}$ through it.
        - Interpretation. Włodarczyk's sheaf of ideals $\tilde I$ on $\tilde M$, which none of his
          clauses mentions, is read as the total transform $\mathrm{prin}_I^*(I)$; it is asserted to
          be a normal-crossings divisor (`IdealSheaf.IsNormalCrossingsDivisor`), the form of clause
          (3) that is local on $\tilde M$.
        - Interpretation. The exact equality for a surjective local analytic isomorphism [Wlo09,
          Theorem 3.5.1 (1)] has no counterpart per pair of compact sets: for $g$ the identity and
          compacts $K' \subsetneq K$ with a centre of the succession over $U_K$ lying over
          $U_K \setminus U_{K'}$, the succession induced over $U_{K'}$ has an empty centre which the
          succession over $U_{K'}$ omits. Its global content is read as: for surjective $g$ the lift
          $\tilde g$ is a surjective local analytic isomorphism identifying $\tilde N$ with
          $N \times_M \tilde M$.
        - Interpretation. Włodarczyk's analytic manifold is read as pure-dimensional: the local
          analytic isomorphisms relate manifolds modelled on one space, and a closed embedding
          relates manifolds modelled on two, so the pairs carry their model space and `P` is one
          assignment over all finite-dimensional model spaces over $\mathbb{K}$.
        - Restatement. The commutation with closed embeddings is stated over every pair of compact
          sets, as the push-forward of a succession up to blow-ups whose centres lie outside the
          part over $\tau(U_{K'})$ (`FiniteSuccession.IsPushforwardUpToEmptyAlong`): the succession
          of `P(M, I)` over $U_K$ also blows up centres over $U_K \setminus \tau(U_{K'})$, which the
          succession over $U_{K'}$ does not see. The strict transforms of $\tau(N)$ are not formed:
          the relation is stated through embeddings of the stages, over $\tau$, with closed images
          containing every centre point over $\tau(U_{K'})$ and along which the centres pull back.
        - Restatement. The commutation with local analytic isomorphisms is stated in two forms: over
          every pair of compact sets, as the relation between two successions of [Wlo09, Theorem
          3.5.1 (2)], and globally, as the lift of $g \colon N \to M$ to a local analytic
          isomorphism $\tilde g \colon \tilde N \to \tilde M$ over $g$ identifying $\tilde N$ with
          the fibre product $N \times_M \tilde M$, the "natural lifting" of [Wlo09, Theorem 2.0.1
          (3)]; the fibre product is stated pointwise, as the bijection of $\tilde g$ between the
          fibres over corresponding points.
        - Strengthening. Every neighbourhood $U_K$ has compact closure, which the source does not
          ask. It makes the commutations apply, for a local analytic isomorphism or a closed
          embedding $g \colon N \to M$, to every compact set $K'$ of $N$: the closure $K$ of
          $g(U_{K'})$ is compact, and $g(U_{K'}) \subseteq K \subseteq U_K$.
        - Strengthening. The clause that $\mathrm{prin}_I$ is an isomorphism over the complement of
          the support of $I$ is not in [Wlo09, Theorem 2.0.3]; it is [Wlo09, Lemma 4.0.3] and, for
          an empty boundary, [Kol07, Theorem 35 (3)].
        - Strengthening. Each centre has a single codimension, and empty centres are admitted (their
          blow-ups are isomorphisms).
        - Gap. Compared with Kollár's functorial principalization [Kol07, Theorem 35]
          (`AlgebraicGeometry.exists_functorial_principalization`): the inputs are pairs $(M, I)$,
          Kollár's triples with an empty boundary; the values are compatible families over the
          compact sets rather than single blow-up sequences, as Kollár's passage to analytic spaces
          provides them [Kol07, 44]; the commutation with smooth morphisms [Kol07, 34.1] is
          asserted, in Włodarczyk's form, for local analytic isomorphisms only, the smooth morphisms
          of relative dimension zero; and the commutation with change of fields [Kol07, 34.2] has no
          counterpart.
    - source: "Włodarczyk 2009, Theorem 2.0.2"
      lean: "AnalyticManifold.exists_embeddedDesingularization"
      module: "Hironaka/Resolution/Analytic/Wlo09/EmbeddedDesingularization.lean"
      status: "proved"
      note: |-
        - Translation. `R` is Włodarczyk's embedded desingularization as a rule on all pairs
          $(M, Y)$, the morphism $\mathrm{res}$ of his clause (4):
          `T.Y.IsLocallyFinitelyDesingularizedBy (R T)` is his conclusion for the embedded pair
          `T = (M, Y)`, with `(R T).map` his $\mathrm{res}_{Y,M}$. `I.regularLocus` is his
          $\operatorname{Reg}(Y)$, the points at which the local ring $\mathcal{O}_{M,x}/I_x$ of $Y$
          is regular, and `((R T).seq K).strictTransformSubspaceSeq (I.restrict ((R T).nhd K)) i` is
          $Y_i$.
        - Translation. "Embeddings of ambient varieties" in clause (4) is read as Kollár's
          commutation with closed embeddings [Kol07, 34.3] over every pair of compact sets, as the
          last sentence of [Wlo09, Theorem 2.0.3] is, the stages of the succession over $N$
          embedding over $\tau$ into those of the succession over $M$.
        - Translation. That no centre is empty is the first half of Włodarczyk's Remark (2) after
          Theorem 2.0.3, in the empty blow-up convention of [Kol07, 32]. The codimension clause
          reads its second half, centres of codimension at least two, with his Remark (1), that the
          blow-up of a centre of codimension one is an isomorphism making it a component of the
          exceptional divisor: a centre of codimension one lies in the exceptional divisor already.
          No centre has codimension zero, since the centres lie over $\operatorname{Sing}(Y)$, which
          for a reduced $Y$ contains no smooth hypersurface germ, and no open set.
        - Correction. The hypothesis that $Y$ is reduced (`isReduced`) is tacit in the source:
          Włodarczyk's $Y$ is "an analytic subspace", but the algebraic original of clause (6)
          assumes "a reduced closed subscheme" [Wlo05, Theorem 4.7.1], and his conclusion fails for
          the double line $Y = V(x^2) \subset \mathbb{K}^2$. His centres have codimension at least
          two [Wlo09, Remark (2) after Theorem 2.0.3], so their images in $\mathbb{K}^2$ form a
          closed discrete set $P$, $\sigma$ is an isomorphism over $\mathbb{K}^2 \setminus P$, and
          no component of $E_r$ meets the preimage $\tilde p$ of a point $p$ of the line off $P$. By
          (6), $I_{\tilde Y, \tilde p} = (x^2)$: either $\tilde Y$ has the non-regular local ring
          $\mathcal{O}/(x^2)$, against (3), or, read as reduced, $I_{\tilde Y} = (x)$ and (6) fails.
          The same argument, with images of dimension at most $\dim M - 2$, applies whenever $Y$ is
          generically non-reduced along a component of dimension $\dim M - 1$. Blowing up the line
          itself, a formal codimension-one blow-up of his Remark (1), would satisfy (3) and (6) with
          $\tilde Y = \emptyset$, but this is excluded by his Remark (2) and by "the support of the
          divisor $E$ is the exceptional locus".
        - Interpretation. His "the support of the divisor $E$ is the exceptional locus of
          $\mathrm{res}_{Y,M}$" is read as $|E_r| = \sigma_K^{-1}(\operatorname{Sing} Y)$ for every
          compact $K$.
        - Interpretation. Clauses (3) and (6) are read at each point: "has only simple normal
          crossings with the exceptional divisor $E_r$", said of $\tilde Y$, with the codimension of
          $\tilde Y$ read at each point and transversally (`IsSncBoundaryTransversalTo`); in
          $\sigma^*(I_Y) = I_{\tilde Y} I_{\tilde E}$, $\tilde E$ near a point is a combination of
          the components of $E_r$ through it, rather than "a locally finite combination of the
          irreducible components of the divisor $E_{U_r}$".
        - Interpretation. Włodarczyk's manifold `M` is read as pure-dimensional: local analytic
          isomorphisms relate manifolds modelled on one space and closed embeddings manifolds
          modelled on two, so the embedded pairs carry their model space and `R` is one assignment
          over all finite-dimensional model spaces.
        - Restatement. Włodarczyk's divisor $E$ and strict transform $\tilde Y$ on $\tilde M$ are
          the `E` and `Y` of `exists_divisor_strictTransform`: on the last stage
          $U_r \cong \mathrm{res}_{Y,M}^{-1}(U_K)$ over every compact (`(R T).toSpace K`) they are
          $E_r$ and $Y_r$, and his clauses (1), (3) and (6) are asserted on $\tilde M$ and on every
          $U_r$. The support identity $|E| = \mathrm{res}_{Y,M}^{-1}(\operatorname{Sing} Y)$ and the
          smoothness of $\tilde Y$ are stated on every $U_r$ only, from which they follow on
          $\tilde M$ (`IdealSheaf.IsGloballyDesingularizedBy.support_eq`,
          `IdealSheaf.IsGloballyDesingularizedBy.isNonsingular`).
        - Restatement. That clause is asserted when no connected component of $N$ lies in $Y$,
          Kollár's "$0 \neq I_Y$": on such a component the embedded desingularization of
          $Y \subseteq N$ is trivial, while that of $Y \subseteq M$ may blow up centres on it where
          other components of $Y$ meet it.
        - Strengthening. That $\mathrm{res}_{Y,M}$ is an isomorphism over
          $M \setminus \operatorname{Sing}(Y)$, whose preimage is, over each $U_K$, the complement
          of the simple normal crossings divisor $E_r$, hence dense, says more than Włodarczyk's
          "bimeromorphic". Over $\operatorname{Reg}(Y)$ it follows from his clause (2); over
          $M \setminus Y$ it is not in Theorem 2.0.2 but holds for his construction, an initial
          segment of the principalization of $I_Y$, which is an isomorphism over
          $M \setminus V(I_Y)$ [Wlo09, Lemma 4.0.3].
        - Strengthening. The factorization is indexed by the compacts `K` of `M`, not only by
          Włodarczyk's compact sets $Z \subset Y$, with $K \subseteq U_K$ made explicit.
        - Strengthening. Each centre has a single codimension.
        - Gap. Non-reduced subspaces with no generically non-reduced component of dimension
          $\dim M - 1$ are not covered: those with embedded components, such as
          $V(x^2, xy) \subset \mathbb{K}^2$, and those generically non-reduced only along components
          of codimension at least two, such as $V(x^2, y) \subset \mathbb{K}^3$. The counterexample
          does not apply to them.
        - Gap. The commutation with local analytic isomorphisms is stated over every pair of compact
          sets only. The lift of $g \colon N \to M$ to a map $\tilde N \to \tilde M$ identifying
          $\tilde N$ with $N \times_M \tilde M$, which the principalization theorem states, is not
          stated here, and with it the global content of the exact equality for a surjective $g$
          [Wlo09, Theorem 3.5.1 (1)], which has no counterpart per pair of compact sets.
        - Gap. Centres of codimension one are not removed from the successions. Deleting their steps
          would leave $\mathrm{res}_{Y,M}$, the exceptional divisors and the strict transforms
          unchanged (the equation of such a centre is a nonzerodivisor modulo the strict transform
          at that stage), but a centre of codimension one of a submanifold $N$ of positive
          codimension pushes forward to a centre of codimension at least two of $M$, so the deletion
          is incompatible with the commutation with closed embeddings in its push-forward form.
          Włodarczyk notes that such blow-ups "may occur for some marked ideals induced on
          subvarieties of ambient varieties" and "determine blow-ups of ambient varieties which are
          not isomorphisms" [Wlo09, Remark after Lemma 5.3.7].
    - source: "Kollár 2007, Theorem 45; Włodarczyk 2009, Theorem 2.0.1"
      lean: "AnalyticSpace.exists_functorial_resolution"
      module: "Hironaka/Resolution/Analytic/Kol07Thm45/ResolutionAssembly.lean"
      status: "proved"
      note: |-
        - Translation. `R.space X` and `R.map X` are Kollár's $R(X)$ and $\Pi_X$ for the input `X`,
          whose underlying space is `X.obj`; `X.regularLocus` is the set of simple points (his
          $X^{ns}$) and `X.singularLocus` its complement; clause (3) is a closed subspace `E` with
          `E.IsSncBoundary` and `E.support` equal to $\Pi_X^{-1}(\operatorname{Sing} X)$.
          Composition `≫` is in diagrammatic order: in (5),
          `ψ ≫ (R.map Y).restrictSet V = (R.map X).restrictSet U ≫ φ` is
          $\Pi_Y|_V \circ \psi = \varphi \circ \Pi_X|_U$, and `ψ ≫ R.map X = R.map X' ≫ φ` is
          $\Pi_X \circ \psi = \varphi \circ \Pi_{X'}$.
        - Interpretation. Kollár's resolution is birational and Włodarczyk's bimeromorphic. Here
          $\Pi_X$ is bimeromorphic onto its image: an isomorphism over an open set whose preimage is
          dense.
        - Strengthening. Over $\mathbb{R}$ the simple locus of a reduced space need not be dense
          [Hir64, Introduction]: the subspace $x^2 + y^2 = 0$ of $\mathbb{R}^2$ is reduced and has
          support the origin and no simple point (in `HironakaExamples`:
          `Hironaka.Space.circleSpace_isReduced`,
          `Hironaka.Manifold.circleIdeal_cosupport_eq_singleton` and
          `Hironaka.Manifold.circleIdeal_regSet_eq_empty`). So $\Pi_X$ need not be surjective; its
          image is the closure of the simple locus, a clause printed in neither source.
        - Strengthening. Włodarczyk's clause (3) lifts every local analytic isomorphism
          $\varphi \colon Y' \to Y$ to a natural local analytic isomorphism
          $\tilde\varphi \colon \tilde Y' \to \tilde Y$. Here the lift is the only morphism
          $R(Y') \to R(Y)$ over $\varphi$, and a local analytic isomorphism; the lift of an
          isomorphism between open subspaces is likewise the only morphism over it, so the lift of
          $\varphi$ restricts, over every open on which $\varphi$ is injective, to the lift of the
          isomorphism of open subspaces, and the naturality follows from the uniqueness. The lift is
          glued from those lifts over the opens on which $\varphi$ is injective, and the uniqueness
          rests on the rigidity of morphisms out of a non-singular space: two morphisms that agree
