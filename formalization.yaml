    - source: "Włodarczyk 2005, Theorem 1.0.2"
      lean: "AlgebraicGeometry.exists_functorial_embeddedDesingularization"
      module: "Hironaka/Resolution/Algebraic/Wlo05/EmbeddedFunctorClauses.lean"
      status: "proved"
      note: |-
        - Translation. `S.totalTransformSeq (DivisorFamily.empty _) i` is Włodarczyk's exceptional
          divisor $E_i$, `S.strictTransformSeq P.Y i` his strict transform $Y_i$, and the image in
          `X` of the smooth locus of `Y → Spec k` is his $\operatorname{Reg}(Y)$.
        - Interpretation. Włodarczyk's "subvariety $Y$ of a smooth variety $X$" is read as a reduced
          closed subscheme `Y` of a smooth, equidimensional algebraic `k`-scheme `X`
          (`EmbeddedPair`). His Bravo–Villamayor strengthening, the source of clause (e), is stated
          for "a reduced closed subscheme" [Wlo05, Theorem 4.7.1].
        - Gap. In clause (e), $\sigma^*(I_Y) = I_{\tilde Y} I_{\tilde E}$, Włodarczyk's divisor
          $\tilde E$ is "a natural combination of the irreducible components of the divisor $E_r$";
          here `J` is only asked to be the ideal sheaf of a simple normal crossing divisor supported
          in $E_r$.
        - Gap. In clause (d) the deletion form, in which `ED(X', Y')` is the pull-back of `ED(X, Y)`
          with the empty blow-ups deleted, is asserted only when the image of `h` meets every
          component of `Y`, whereas Włodarczyk's (d), read through his Definition 2.1.5 (extensions
          by isomorphisms) and Proposition 2.4.2, asserts it for every smooth `h`. The construction
          handles the components of `Y` in rounds whose boundary data depend on all of them, and
          over an open subset missing a component the runs fall out of step: for `Y` the disjoint
          union of a smooth surface and the three coordinate axes through a point off it, in a
          smooth threefold, the pull-back of `ED(X, Y)` to the complement of the surface has three
          non-empty centres that the run on that complement lacks.
        - Gap. The parts of Włodarczyk's (d) on embeddings of ambient varieties and on equivariance
          under group actions have no counterpart; in particular, although the family `ED` has one
          functor for each field, no clause relates the functors of different fields, as Kollár's
          change of fields [Kol07, 34.2] (`CommutesWithChangeOfFields`) does. The functor built here
          is not Włodarczyk's single invariant-driven run, and functoriality for closed embeddings
          is, in Kollár's words, "quite delicate" [Kol07, 34 and Claim 71.2]: he proves it only for
          an empty boundary, whereas the later rounds here run with the exceptional divisors of the
          earlier ones as boundary.
    - source: "Hironaka 1964, Main Theorem II″(N), pp. 158–159; Włodarczyk 2009, Theorem 2.0.3 (1) and (4)"
      lean: "AnalyticManifold.exists_extensionCompatibleFamily_weakTransformSeq_eq_top"
      module: "Hironaka/Resolution/Analytic/Wlo09/HironakaAssembly.lean"
      status: "proved"
      note: |-
        - Translation. `F : ExtensionCompatibleFamily X` with `F.map` is the pair
          $(\tilde X, \sigma)$; `F.nhd K` is $U_K$ and `F.seq K` the finite succession over it;
          `(F.seq K).weakTransformSeq (J₀.restrict (F.nhd K)) i` is $J_i$ and
          `(F.seq K).boundarySeq (E₀.restrict (F.nhd K)) i` is $E_i$.
        - Translation. A real-analytic manifold, `X : AnalyticManifold ℝ E`, is Hironaka's
          non-singular analytic $\mathbb{R}$-space.
        - Interpretation. Hironaka's "has only normal crossings" for the boundary is read on his
          global irreducible components [Hir64, Definition 2, p. 141], that is, as simple normal
          crossings in the sense of [Kol07, Definition 24] (`IsSncBoundary`, `IsSncBoundaryWith`).
        - Interpretation. Hironaka's "coherent sheaf of non-zero ideals" is read as a locally
          finitely generated ideal sheaf (`IdealSheaf X`, coherent by Oka's theorem) with nonzero
          stalks (`hJ₀`).
        - Restatement. The reducedness and invertibility of `E₀`, which Hironaka assumes ("reduced
          analytic subspace everywhere of codimension one"), are not separate hypotheses: both
          follow from the family of smooth hypersurfaces with simple normal crossings that `hE₀`
          provides, whose reduced ideal sheaf is `E₀`.
        - Strengthening. In clause (iii) `IsSncBoundaryWith` also asserts that $E_i$ has only normal
          crossings at every point, which Hironaka's "with $D_i$" [Hir64, Definition 2, p. 141] does
          not; he derives it from (iii) (the remark after Main Theorem II, p. 143), and it is
          [Wlo09, Theorem 2.0.3 (2)].
        - Gap. Hironaka's succession is one locally finite succession
          $\{f_\lambda : X_{\lambda+1} \to X_\lambda\}$ of $X$ itself, indexed by a countable
          well-ordered set $\Lambda$ with maximal element $\gamma$ (projective limits at the
          elements without predecessor) [Hir64, p. 155], whose canonical modification
          $X_\gamma \to X$ he notes is proper (p. 155, after Main Theorem I′(n)). Here it is
          replaced by a finite succession $U_0 \leftarrow \cdots \leftarrow U_r$ (`F.seq K`) over a
          neighbourhood $U_K$ (`F.nhd K`) of each compact $K$, compatible across compacts, and the
          proper map $\sigma$ (`F.map`). Restricting Hironaka's succession over $U_K$ gives such a
          family (by local finiteness only finitely many centres meet the preimage of $U_K$); the
          compatible family is not asserted to come from one succession of $X$. Włodarczyk's
          "locally finite" is the compatible-family form itself.
        - Gap. Clause (i) asserts non-singularity only, and a centre may be empty or have several
          components. Hironaka's irreducibility of the centres is not asserted per compact:
          Włodarczyk's centres are disjoint unions of smooth centres [Wlo09, Definition 3.2.4], and
          the irreducible refinement of the succession over a smaller compact is in general not the
          restriction of the succession over a larger one, which [Wlo09, Theorem 2.0.3 (4)]
          requires.
        - Gap. Hironaka's $X$ is any non-singular analytic $\mathbb{R}$-space; II″(N) does not fix
          its dimension (the "of dimension $N$" is in II′(N), p. 156). Here `X` has one model space
          `E`, so it is pure-dimensional; a non-singular space whose components have different
          dimensions is the disjoint union of its pure-dimensional open and closed parts, to each of
          which the theorem applies. No finite-dimensionality of `E` is assumed: the coordinates
          `E ≃ ℝⁿ` that `hE₀` provides make `E` finite-dimensional.
