        dispatching parallel work lanes (statement, proof and reader/review lanes, each in its own
        git worktree) over a step-by-step plan written from the sources, with gate scripts and the
        process material (plan, decision register, ledger) kept in the repository during the
        campaign and removed at release. The main theorems were fixed as sorried statements first
        and the proofs connected to them afterwards, each connection checked by an elaborated-type
        comparison. GPT-6 Astra was consulted on counterexamples and proof write-ups. Claude Fable
        5.1 wrote the Lean. The main campaign was followed by the release clean-up and, on
        2026-09-29, the degenerate case and the dimension-free form of Main Theorems II and II(N)
        and Corollaries 1 and 3, and the coherence theorem for extension-compatible families.
      cost:
        wall_time: "2026-09-04 to 2026-09-12, 2026-09-22 to 2026-09-23, 2026-09-29"
        hardware: >
          One virtual machine (Nebius; 32 vCPUs on an AMD EPYC Genoa processor, 125 GiB of memory,
          1.3 TB of disk, no GPU; Ubuntu 24.04), running the orchestrator and lane sessions;
          models through the Anthropic and OpenAI APIs.
        tokens: >
          Claude API tokens of the Claude Code sessions on the machine, summed from the session
          transcripts. Main campaign, 2026-09-04 to 2026-09-16:
          286 sessions, 160,899 assistant messages, 87.3 G input tokens (79.3 G cache reads, 8.1 G
          cache writes, 3.9 M uncached) and 283 M output tokens, of which one lane on
          claude-opus-4-8 accounts for 1.9 G input and 6 M output. Release clean-up, 2026-09-22 to
          2026-09-23: 121 sessions, 6.0 G input (5.6 G cache reads) and 22.7 M output. The three
          changes of 2026-09-29: four sessions, 129 M input and 1.1 M output. In total 93.4 G
          input and 307 M output tokens over 411 sessions. Not counted: the GPT-6 Astra
          consultations through the OpenAI API, and the owner's own sessions on another machine.
      prompting_notes: >
        Owner-directed: the owner wrote the high-level plan and made the decisions where the sources
        disagreed or were incomplete; the agents wrote the atomic plan, the statements, the proofs
        and the reviews. Every departure from a printed statement was recorded at the time and is
        reproduced in the docstrings and in alignment.statements.
