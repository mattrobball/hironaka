  notes: >
    Agent-written Lean under human direction throughout. The proofs were written by the agents
    following the sources' arguments; the humans chose the sources and the route, fixed the
    statements of record, ruled on the departures, and audited the statements against the sources.
    No proof was written by hand.

fidelity:
  divergences: >
    Listed per theorem, in the `note` of each entry of alignment.statements, as in the section
    "Relation to the source." of the theorem's docstring. Every item is labelled by its kind:
    Translation (a dictionary entry: a Lean expression and what it is in the source), Unformalised
    (an item of the source with no formal counterpart yet), Out of scope (one with none, by
    decision), Correction (the printed claim is false; the hypothesis it needs is added),
    Interpretation (the reading the library fixes where the source's wording admits more than one),
    Restatement (a logically equivalent form), Strengthening (the formal statement implies the
    source's), Gap (the formal statement is weaker or incomparable), Formalisation note (a remark
    that is none of these). The definitions the statements use carry such sections too, read in
    their docstrings and in the blueprint.

review:
  status: "self-assessed"
  reviewers:
    - "Chris Elliott (statements against the sources, spot checks and the departures)"
    - "Billy Snikkers (statement audit through the Challenge files and the comparator)"
    - "Adam Newgas (Tau Ceti review rubrics run over the library; release engineering)"
  notes: >
    During the campaign, reader/review lanes gave recorded verdicts on every landing, and GPT-6
    Astra reviewed selected proof write-ups. After the release clean-up, six independent agent
    reviews (28 September 2026) compared every main theorem and its definitions against the source
    texts and the prose; their findings were folded into the docstrings, the README and this file.
    The restatement of the main theorems in the clause vocabulary of the definition modules
    (1 October 2026) followed five further agent reviews (faithfulness, readability, Lean,
    completeness, public release), and Hironaka's theorems were then audited against the printed
    pages of the Annals. leanprover/comparator checks the main theorems in continuous integration.
    No review by anyone outside the authors' organization is recorded.

