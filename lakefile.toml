# Hironaka's resolution of singularities in characteristic zero, formalized in Lean 4 over Mathlib:
# the library `Hironaka`
# (schemes, analytic manifolds and analytic spaces) and the worked examples `HironakaExamples`.
name = "hironaka"
version = "0.1.0"
keywords = ["math", "algebraic-geometry", "resolution-of-singularities", "analytic-geometry"]
description = "Hironaka's resolution of singularities in characteristic zero, formalized in Lean 4 over Mathlib."
license = "Apache-2.0"
licenseFiles = ["LICENSE"]
readmeFile = "README.md"
defaultTargets = ["Hironaka"]
enableArtifactCache = true

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true
# The copyright block of every file is checked by scripts/check_header.py, so Mathlib's header style check is off.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "Hironaka"
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "HironakaExamples"
leanOptions = { warningAsError = true }

# The `@[source KEY "locator" "page"]` attribute and its bibliography registry: tooling with no
# mathematics and nothing specific to this library.
[[lean_lib]]
name = "SourceAttr"
leanOptions = { warningAsError = true }

# Tests of the attribute, against this package's bibliography. Not a default target.
[[lean_lib]]
name = "SourceAttrTest"
leanOptions = { warningAsError = true }

# The bibliography of the package, read by the module `HironakaReferences` when it is compiled.
# A library's `needs` are dependencies of each of its modules: this library holds that module
# alone, so a change to `references.bib` rebuilds it and the modules that import it, and no others.
[[input_file]]
name = "references"
path = "references.bib"
text = true

[[lean_lib]]
name = "HironakaReferences"
roots = ["HironakaReferences"]
needs = ["references"]
leanOptions = { warningAsError = true }

# The audit surface: the main theorems stated with `sorry` in the files under `Challenge/`, which
# import only the vocabulary modules (the `Defs.lean` files), `SourceAttr`, `HironakaReferences` and the Mathlib
# modules the statements need, not all of Mathlib (see `Challenge.lean` and `comparator.json`).
# Not a default target.
[[lean_lib]]
name = "Challenge"

